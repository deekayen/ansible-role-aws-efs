---
galaxy_info:
  namespace: deekayen
  role_name: aws_efs
  author: David Norman
  description: Mount an EFS share on an AWS server.

  github_branch: main
  issue_tracker_url: https://github.com/deekayen/ansible-role-aws-efs/issues

  license: BSD-3-Clause
  min_ansible_version: "2.15"

  platforms:
    - name: Amazon
      versions:
        - "all"
    - name: EL
      versions:
        - "8"
        - "9"

  galaxy_tags:
    - aws
    - efs
    - nfs
    - filesystem
    - mount

dependencies:
  - role: deekayen.repo_ius
    when: ansible_os_family == "RedHat"
