---
- name: Validate role variables.
  ansible.builtin.import_tasks: assert.yml
  tags:
    - always

# Using encryption of data in transit with the Amazon EFS mount
# helper requires OpenSSL version 1.0.2 or newer.
- name: Install dependencies for Amazon EFS Utils.
  ansible.builtin.package:
    name:
      - gcc
      - openssl-devel
    state: present

# Amazon Linux 2023 ships amazon-efs-utils, which pulls in a stunnel new
# enough for TLS mounts. Elsewhere, point at a repository that carries the
# package before running this role.
- name: Install Amazon EFS Utils.
  ansible.builtin.package:
    name: amazon-efs-utils
    state: present

- name: Install nfs-common (Debian).
  ansible.builtin.package:
    name: nfs-common
    state: present
  when: ansible_os_family == 'Debian'

- name: Install nfs-utils (RedHat).
  ansible.builtin.package:
    name: nfs-utils
    state: present
  when: ansible_os_family == 'RedHat'

# mkdir -p ${efs_directory}
- name: Create directories for the mounts.
  ansible.builtin.file:
    path: "{{ item.path | default('/mnt/efs') }}"
    state: directory
    mode: "{{ item.mode | default('0644') }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
  loop: "{{ aws_efs_paths }}"

# echo "${file_system_id_01}:/ ${efs_directory} efs tls,_netdev" >> /etc/fstab
# mount -a -t efs defaults
- name: Mount paths.
  ansible.posix.mount:
    path: "{{ item.path | default('/mnt/efs') }}"
    src: "{{ item.filesystem_id }}:/"
    fstype: efs
    opts: "{{ item.defaults | default('tls') }},_netdev"
    state: "{{ aws_efs_mount_state }}"
  loop: "{{ aws_efs_paths }}"
